name: bridge

# Publishes the static HTTPS bridge used by the mod to GitHub Pages.
# The mod's VPK points at https://romareyme.github.io/deadlock-seasonal-stats/
on:
  push:
    branches: [main]
    paths:
      - 'seasonal-stats/https-bridge/dist/**'
      - '.github/workflows/bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: seasonal-stats/https-bridge/dist
      - id: deployment
        uses: actions/deploy-pages@v4
